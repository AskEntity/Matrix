[test]
# All tests (src/ + web/) run with a single `bun test`.
# Web render tests manage happy-dom lifecycle internally (beforeAll/afterAll).
# Preload binds react-dom's scheduler to bun-native timers BEFORE any test
# file can register happy-dom — otherwise the whole web suite's fate depends
# on bun's filesystem-dependent file order. See src/test-utils/preload.ts.
preload = ["./src/test-utils/preload.ts"]

[test.env]
# Run the suite BM25-only: no 500MB model load, no embedder child process.
# Tests that want vectors install a mock pipeline instead, which takes
# priority over this flag.
#
# This is a speed choice, not a safety one. It used to be the thing keeping
# `bun test` alive — embeddings loaded onnxruntime-node into the worker
# thread, and a live ORT session in an ENDING thread aborts the process
# (exit 133), so every daemon test's worker teardown killed the run. The
# session now lives in a child process whose main thread owns it
# (src/embedder-client.ts), so teardown is clean either way.
MXD_DISABLE_EMBEDDINGS = "1"
